<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Credit: (hank!nd3 p4d4y41! | FAYAS MONU -->
<title>Compress PDF — MULTI TOOLS HUB</title>
<meta name="description" content="Make a PDF smaller by re-saving each page as an optimised image.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOLS HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Compress PDF</h1>
<p class="lead">Make a PDF smaller by re-saving each page as an optimised image.</p>
<label class="drop" id="zone"><i class="fa-solid fa-file-zipper" aria-hidden="true"></i><strong>Choose a PDF or drop it here</strong><span>One file at a time</span>
<input type="file" id="fileInput" accept="application/pdf" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span id="sz" style="color:var(--muted)"></span></p>
  <label class="f" for="lv">Compression level</label>
  <select class="in" id="lv"><option value="1.5,0.8">Light (best quality)</option><option value="1.2,0.6" selected>Recommended</option><option value="1,0.4">Strong (smallest file)</option></select>
  <div class="prog" id="prog"><div></div></div>
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-compress"></i> Compress PDF</button></div>
  <p class="hint">Pages become images, so text in the result can’t be selected or searched. Keep your original.</p>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script src="../assets/app.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let file=null;const $=PE.$;
PE.drop($("zone"),$("fileInput"),/pdf/i,l=>{file=l[0];$("fn").textContent=file.name;$("sz").textContent=PE.fmt(file.size);$("panel").hidden=false;PE.status("")});
$("go").onclick=async()=>{
  $("go").disabled=true;const [scale,q]=$("lv").value.split(",").map(Number);
  try{
    const src=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,out=await PDFLib.PDFDocument.create(),n=src.numPages;
    for(let i=1;i<=n;i++){
      PE.status(`Compressing page ${i} of ${n}…`);PE.progress((i-1)/n);
      const p=await src.getPage(i),vp=p.getViewport({scale}),base=p.getViewport({scale:1}),c=document.createElement("canvas");
      c.width=vp.width;c.height=vp.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
      await p.render({canvasContext:x,viewport:vp}).promise;
      const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)),img=await out.embedJpg(await b.arrayBuffer());
      out.addPage([base.width,base.height]).drawImage(img,{x:0,y:0,width:base.width,height:base.height});c.width=c.height=0;
    }
    const bytes=await out.save();PE.progress(1);
    if(bytes.length>=file.size){PE.status(`This file is already well optimised (${PE.fmt(file.size)} → ${PE.fmt(bytes.length)}). Your original is the better copy.`,"err")}
    else{PE.download(bytes,"compressed_"+file.name,"application/pdf");PE.status(`${PE.fmt(file.size)} → ${PE.fmt(bytes.length)} (${Math.round((1-bytes.length/file.size)*100)}% smaller).`,"ok");PE.toast("Download started")}
  }catch(e){PE.progress(null);PE.status("Couldn’t read this PDF. It may be damaged or password-protected.","err")}
  $("go").disabled=false;
};
</script>
</body>
</html>
