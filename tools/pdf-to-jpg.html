<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Credit: (hank!nd3 p4d4y41! | FAYAS MONU -->
<title>PDF to JPG — MULTI TOOL HUB</title>
<meta name="description" content="Turn every page into a JPG image. All pages download together in one ZIP file.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOL HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>PDF to JPG</h1>
<p class="lead">Turn every page into a JPG image. All pages download together in one ZIP file.</p>
<label class="drop" id="zone"><i class="fa-solid fa-file-image" aria-hidden="true"></i><strong>Choose a PDF or drop it here</strong><span>One file at a time</span>
<input type="file" id="fileInput" accept="application/pdf" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span id="pc" style="color:var(--muted)"></span></p>
  <label class="f" for="q">Image quality</label>
  <select class="in" id="q"><option value="1.5">Standard (smaller files)</option><option value="2" selected>High</option><option value="3">Very high (large files)</option></select>
  <div class="prog" id="prog"><div></div></div>
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-file-zipper"></i> Convert &amp; download ZIP</button></div>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<div class="foot"><a href="../terms.html">Terms &amp; Conditions</a><a href="../privacy.html">Privacy Policy</a><span>&copy; 2026 MULTI TOOL HUB</span></div>
<script src="../assets/app.js"></script>
<script src="../assets/chat.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let file=null;const $=PE.$;
PE.drop($("zone"),$("fileInput"),/pdf/i,l=>{file=l[0];$("fn").textContent=file.name;$("pc").textContent="";$("panel").hidden=false;PE.status("")});
$("go").onclick=async()=>{
  $("go").disabled=true;
  try{
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,zip=new JSZip(),n=pdf.numPages,scale=+$("q").value;
    $("pc").textContent="· "+n+" pages";
    for(let i=1;i<=n;i++){
      PE.status(`Converting page ${i} of ${n}…`);PE.progress((i-1)/n);
      const page=await pdf.getPage(i),vp=page.getViewport({scale}),cv=document.createElement("canvas");
      cv.width=vp.width;cv.height=vp.height;
      const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:cx,viewport:vp}).promise;
      const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",.92));
      zip.file(`page-${String(i).padStart(3,"0")}.jpg`,blob);cv.width=cv.height=0;
    }
    PE.status("Packing ZIP…");
    PE.download(await zip.generateAsync({type:"blob"}),PE.baseName(file.name)+"-pages.zip");
    PE.progress(1);PE.status(`Done. ${n} JPG files are in your ZIP.`,"ok");PE.toast("Download started");
  }catch(e){PE.progress(null);PE.status("Couldn’t read this PDF. It may be damaged or password-protected.","err")}
  $("go").disabled=false;
};
</script>
</body>
</html>
