<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Credit: (hank!nd3 p4d4y41! | FAYAS MONU -->
<title>Organize Pages — MULTI TOOL HUB</title>
<meta name="description" content="See every page, then reorder, rotate or delete pages and download the result.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOL HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Organize Pages</h1>
<p class="lead">See every page, then reorder, rotate or delete pages and download the result.</p>
<label class="drop" id="zone"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i><strong>Choose a PDF or drop it here</strong><span>One file at a time</span>
<input type="file" id="fileInput" accept="application/pdf" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span id="pc" style="color:var(--muted)"></span></p>
  <div id="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px"></div>
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-download"></i> Download PDF</button><button class="btn ghost" id="undo">Restore all</button></div>
  <p class="hint">Deleted pages are removed from the new file. Your original stays unchanged.</p>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<div class="foot"><a href="../terms.html">Terms &amp; Conditions</a><a href="../privacy.html">Privacy Policy</a><span>&copy; 2026 MULTI TOOL HUB</span></div>
<script src="../assets/app.js"></script>
<script src="../assets/chat.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let file=null,pages=[];const $=PE.$;
function render(){
  const live=pages.filter(p=>!p.del).length;$("pc").textContent=`· ${live} of ${pages.length} pages kept`;$("go").disabled=!live;
  const g=$("grid");g.innerHTML="";
  pages.forEach((p,i)=>{
    const c=document.createElement("div");c.style.cssText="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center"+(p.del?";opacity:.35":"");
    const box=document.createElement("div");box.style.cssText="height:150px;display:grid;place-items:center;overflow:hidden";
    const im=new Image();im.src=p.thumb;im.alt="Page "+p.orig;im.style.cssText=`max-width:100%;max-height:150px;transform:rotate(${p.rot}deg);transition:transform .15s`;box.appendChild(im);
    const bar=document.createElement("div");bar.style.cssText="display:flex;justify-content:center;gap:4px;margin-top:8px";
    [["fa-arrow-left","Move earlier",()=>swap(i,i-1),i===0],["fa-rotate-right","Rotate",()=>{p.rot=(p.rot+90)%360;render()},false],
     [p.del?"fa-rotate-left":"fa-trash",p.del?"Restore":"Delete",()=>{p.del=!p.del;render()},false],["fa-arrow-right","Move later",()=>swap(i,i+1),i===pages.length-1]]
    .forEach(([ic,lb,fn,dis])=>{const b=document.createElement("button");b.className="ib";b.setAttribute("aria-label",lb+" page "+p.orig);b.title=lb;b.disabled=dis;b.innerHTML=`<i class="fa-solid ${ic}"></i>`;b.onclick=fn;bar.appendChild(b)});
    const t=document.createElement("div");t.style.cssText="font-size:12.5px;color:var(--muted);margin-top:6px";t.textContent="Page "+p.orig;
    c.append(box,bar,t);g.appendChild(c);
  });
}
function swap(i,j){[pages[i],pages[j]]=[pages[j],pages[i]];render()}
PE.drop($("zone"),$("fileInput"),/pdf/i,async l=>{
  file=l[0];pages=[];PE.status("Creating thumbnails…");
  try{
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    if(pdf.numPages>200){PE.status("This PDF has more than 200 pages. Split it first, then organize each part.","err");return}
    for(let i=1;i<=pdf.numPages;i++){
      PE.progress((i-1)/pdf.numPages);
      const pg=await pdf.getPage(i),vp=pg.getViewport({scale:.35}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;
      pages.push({orig:i,rot:0,del:false,thumb:c.toDataURL("image/jpeg",.7)});
    }
    PE.progress(null);$("fn").textContent=file.name;$("panel").hidden=false;PE.status("");render();
  }catch(e){PE.progress(null);PE.status("Couldn’t read this PDF. It may be damaged or password-protected.","err")}
});
$("undo").onclick=()=>{pages.sort((a,b)=>a.orig-b.orig).forEach(p=>{p.rot=0;p.del=false});render()};
$("go").onclick=async()=>{
  $("go").disabled=true;
  try{
    const src=await PE.readPdf(file),out=await PDFLib.PDFDocument.create(),keep=pages.filter(p=>!p.del);
    const copied=await out.copyPages(src,keep.map(p=>p.orig-1));
    copied.forEach((cp,i)=>{if(keep[i].rot)cp.setRotation(PDFLib.degrees((cp.getRotation().angle+keep[i].rot)%360));out.addPage(cp)});
    PE.download(await out.save(),"organized_"+file.name,"application/pdf");
    PE.status(`Saved a PDF with ${keep.length} pages.`,"ok");PE.toast("Download started");
  }catch(e){PE.status(e.message,"err")}
  $("go").disabled=false;
};
</script>
</body>
</html>
