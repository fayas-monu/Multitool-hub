<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Downloader — PDF Edit Tool</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 14px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 900;
      color: #e1306c;
      text-decoration: none;
      text-transform: uppercase;
    }

    .container {
      max-width: 700px;
      margin: 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 95%;
    }

    h1 {
      font-size: 24px;
      color: #1a1a1a;
      margin-bottom: 6px;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-box input {
      flex: 1;
      padding: 14px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .input-box button {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }

    .download-area {
      display: none;
      margin-top: 10px;
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 520px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      background: #fafafa;
    }

    footer {
      background: #ffffff;
      border-top: 1px solid #e0e0e0;
      margin-top: auto;
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <header>
    <a href="../index.html" class="logo-container">
      <i class="fa-brands fa-instagram"></i>
      <span>Instagram Downloader</span>
    </a>
  </header>

  <div class="container">
    <h1><i class="fa-brands fa-instagram" style="color: #e1306c;"></i> Instagram Downloader</h1>
    <p class="subtitle">Direct & Working Instagram Reel & Video Downloader</p>

    <div class="input-box">
      <input type="text" id="instagramUrl" placeholder="Paste Instagram Reel or Video link here...">
      <button onclick="processDownload()">Get Video</button>
    </div>

    <div class="download-area" id="downloadArea">
      <iframe id="downloadWidget" src="" scrolling="no" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
    </div>
  </div>

  <footer>
    &copy; 2026 PDF EDIT TOOL. All rights reserved. | Credit: <strong>chank!nd3 p4d4y41! | FAYAS MONU</strong>
  </footer>

  <script>
    function processDownload() {
      const urlInput = document.getElementById('instagramUrl').value.trim();

      if (!urlInput || !urlInput.includes('instagram.com')) {
        alert("Please paste a valid Instagram URL!");
        return;
      }

      const widgetFrame = document.getElementById('downloadWidget');
      const containerArea = document.getElementById('downloadArea');

      // Clean ad-free secure embedded iframe endpoint
      widgetFrame.src = `https://saveig.app/en/widget?url=${encodeURIComponent(urlInput)}`;
      containerArea.style.display = 'block';
    }
  </script>
</body>
</html>
