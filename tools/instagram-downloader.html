<link rel="manifest" href="../manifest.webmanifest">

<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">PDF EDIT TOOL</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Instagram Downloader</h1>
<p class="lead">Save a public Instagram reel, video or post from a link.</p>
<div class="panel">
  <label class="f" for="u">Link</label>
  <input class="in" id="u" type="url" placeholder="https://www.instagram.com/reel/…" autocomplete="off">
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-download"></i> Get download options</button></div>
  <p class="hint">This tool sends the link to the third-party service Loader.to. Only download content you own or have permission to save.</p>
</div>
<div class="panel" id="box" hidden><iframe id="frame" title="Download options" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-downloads" style="width:100%;height:420px;border:0;border-radius:10px;background:#fff"></iframe></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script src="../assets/app.js"></script>
<script>
const $=PE.$;
function run(){
  const u=$("u").value.trim();
  let h;try{h=new URL(u).hostname}catch(e){}
  if(!h||!/(^|\.)instagram\.com$/.test(h)){PE.status("Paste a full instagram.com link.","err");return}
  PE.status("");$("frame").src=`https://loader.to/api/card/?url=${encodeURIComponent(u)}`;$("box").hidden=false;
}
$("go").onclick=run;$("u").addEventListener("keydown",e=>{if(e.key==="Enter")run()});
</script>
</body>
</html>
