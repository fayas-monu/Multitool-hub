<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Credit: (hank!nd3 p4d4y41! | FAYAS MONU -->
<title>Split PDF — MULTI TOOLS HUB</title>
<meta name="description" content="Extract the pages you need, or save every page as its own file.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOLS HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Split PDF</h1>
<p class="lead">Extract the pages you need, or save every page as its own file.</p>
<label class="drop" id="zone"><i class="fa-solid fa-scissors" aria-hidden="true"></i><strong>Choose a PDF or drop it here</strong><span>One file at a time</span>
<input type="file" id="fileInput" accept="application/pdf" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span id="pc" style="color:var(--muted)"></span></p>
  <fieldset style="border:0;margin-top:12px"><legend class="f" style="padding:0">What do you want?</legend>
    <label style="display:block;padding:6px 0"><input type="radio" name="m" value="range" checked> Extract pages into one PDF</label>
    <label style="display:block;padding:6px 0"><input type="radio" name="m" value="each"> Save every page as a separate PDF (ZIP)</label>
    <label style="display:block;padding:6px 0"><input type="radio" name="m" value="chunk"> Split into parts of a set size (ZIP)</label>
  </fieldset>
  <div id="rangeBox"><label class="f" for="rg">Pages to extract</label><input class="in" id="rg" placeholder="e.g. 1-3, 5, 8-"></div>
  <div id="chunkBox" hidden><label class="f" for="ch">Pages per part</label><input class="in" id="ch" type="number" min="1" value="5"></div>
  <div class="prog" id="prog"><div></div></div>
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-scissors"></i> Split &amp; download</button></div>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script src="../assets/app.js"></script>
<script>
let file=null,doc=null;const $=PE.$,mode=()=>document.querySelector("[name=m]:checked").value;
document.querySelectorAll("[name=m]").forEach(r=>r.onchange=()=>{$("rangeBox").hidden=mode()!=="range";$("chunkBox").hidden=mode()!=="chunk"});
PE.drop($("zone"),$("fileInput"),/pdf/i,async l=>{
  file=l[0];PE.status("Reading PDF…");
  try{doc=await PE.readPdf(file);$("fn").textContent=file.name;$("pc").textContent="· "+doc.getPageCount()+" pages";$("rg").value="1-"+doc.getPageCount();$("panel").hidden=false;PE.status("")}
  catch(e){PE.status(e.message,"err")}
});
async function part(idx){const o=await PDFLib.PDFDocument.create();(await o.copyPages(doc,idx)).forEach(p=>o.addPage(p));return o.save()}
$("go").onclick=async()=>{
  $("go").disabled=true;const n=doc.getPageCount(),base=PE.baseName(file.name);
  try{
    if(mode()==="range"){
      const idx=PE.ranges($("rg").value,n);PE.download(await part(idx),`${base}_pages.pdf`,"application/pdf");
      PE.status(`Extracted ${idx.length} pages.`,"ok");
    }else{
      const size=mode()==="each"?1:Math.max(1,Math.floor(+$("ch").value||1)),zip=new JSZip(),parts=Math.ceil(n/size);
      for(let i=0;i<parts;i++){
        PE.status(`Creating part ${i+1} of ${parts}…`);PE.progress(i/parts);
        const idx=[];for(let p=i*size;p<Math.min(n,(i+1)*size);p++)idx.push(p);
        zip.file(`${base}_${size===1?"page":"part"}-${String(i+1).padStart(3,"0")}.pdf`,await part(idx));
      }
      PE.download(await zip.generateAsync({type:"blob"}),`${base}_split.zip`);PE.progress(1);PE.status(`Saved ${parts} files in a ZIP.`,"ok");
    }
    PE.toast("Download started");
  }catch(e){PE.progress(null);PE.status(e.message,"err")}
  $("go").disabled=false;
};
</script>
</body>
</html>
