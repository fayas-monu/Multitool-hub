<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Credit: (hank!nd3 p4d4y41! | FAYAS MONU -->
<title>Rotate PDF — MULTI TOOLS HUB</title>
<meta name="description" content="Turn every page of a PDF left, right or upside down, then download it.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOLS HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Rotate PDF</h1>
<p class="lead">Turn every page of a PDF left, right or upside down, then download it.</p>
<label class="drop" id="zone"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i><strong>Choose a PDF or drop it here</strong><span>One file at a time</span>
<input type="file" id="fileInput" accept="application/pdf" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span class="sz" id="info" style="color:var(--muted)"></span></p>
  <div class="row">
    <button class="btn ghost" data-r="-90"><i class="fa-solid fa-rotate-left"></i> Left 90°</button>
    <button class="btn ghost" data-r="90"><i class="fa-solid fa-rotate-right"></i> Right 90°</button>
    <button class="btn ghost" data-r="180"><i class="fa-solid fa-arrows-up-down"></i> 180°</button>
    <button class="btn ghost" id="reset">Reset</button>
  </div>
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-download"></i> Download rotated PDF</button></div>
  <p class="hint" id="cur">Rotation to apply: 0°</p>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script src="../assets/app.js"></script>
<script>
let file=null,rot=0;const $=PE.$;
function show(){$("cur").textContent="Rotation to apply: "+rot+"°";$("go").disabled=rot===0}
PE.drop($("zone"),$("fileInput"),/pdf/i,l=>{file=l[0];rot=0;$("fn").textContent=file.name;$("info").textContent=PE.fmt(file.size);$("panel").hidden=false;PE.status("");show()});
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rot=((rot+ +b.dataset.r)%360+360)%360;show()});
$("reset").onclick=()=>{rot=0;show()};
$("go").onclick=async()=>{
  try{
    const doc=await PE.readPdf(file);
    doc.getPages().forEach(p=>p.setRotation(PDFLib.degrees((p.getRotation().angle+rot)%360)));
    PE.download(await doc.save(),"rotated_"+file.name,"application/pdf");
    PE.status("Rotated "+doc.getPageCount()+" pages.","ok");PE.toast("Download started");
  }catch(e){PE.status(e.message,"err")}
};
show();
</script>
</body>
</html>
