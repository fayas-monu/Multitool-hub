  <script>
    let selectedFile = null;

    function handleFile(event) {
      selectedFile = event.target.files[0];
      if (selectedFile) {
        document.getElementById('file-label').innerText = "Selected: " + selectedFile.name;
        document.getElementById('convertBtn').style.display = 'inline-block';
        document.getElementById('statusMsg').innerText = "";
      }
    }

    async function convertVideoToAudio() {
      if (!selectedFile) return;

      const status = document.getElementById('statusMsg');
      status.style.color = '#1976d2';
      status.innerText = "Extracting Audio... Please wait!";

      try {
        const arrayBuffer = await selectedFile.arrayBuffer();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const wavBlob = audioBufferToWav(audioBuffer);
        const url = URL.createObjectURL(wavBlob);

        const a = document.createElement('a');
        a.href = url;
        a.download = selectedFile.name.replace(/\.[^/.]+$/, "") + ".mp3";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        status.style.color = '#2e7d32';
        status.innerText = "Conversion Successful! Audio file downloaded.";
      } catch (err) {
        status.style.color = '#d32f2f';
        status.innerText = "Error extracting audio. Please try another video file.";
        console.error(err);
      }
    }

    // Helper Function to Encode AudioBuffer to WAV
    function audioBufferToWav(buffer) {
      let numChannels = buffer.numberOfChannels;
      let sampleRate = buffer.sampleRate;
      let format = 1; // PCM
      let bitDepth = 16;
      
      let result;
      if (numChannels === 2) {
        result = interleave(buffer.getChannelData(0), buffer.getChannelData(1));
      } else {
        result = buffer.getChannelData(0);
      }

      return writeWavFile(result, sampleRate, numChannels, bitDepth);
    }

    function interleave(inputL, inputR) {
      let length = inputL.length + inputR.length;
      let result = new Float32Array(length);
      let index = 0, inputIndex = 0;
      while (index < length) {
        result[index++] = inputL[inputIndex];
        result[index++] = inputR[inputIndex];
        inputIndex++;
      }
      return result;
    }

    function writeWavFile(samples, sampleRate, numChannels, bitDepth) {
      let bytesPerSample = bitDepth / 8;
      let blockAlign = numChannels * bytesPerSample;
      let buffer = new ArrayBuffer(44 + samples.length * bytesPerSample);
      let view = new DataView(buffer);

      /* RIFF identifier */
      writeString(view, 0, 'RIFF');
      /* RIFF chunk length */
      view.setUint32(4, 36 + samples.length * bytesPerSample, true);
      /* RIFF type */
      writeString(view, 8, 'WAVE');
      /* format chunk identifier */
      writeString(view, 12, 'fmt ');
      /* format chunk length */
      view.setUint32(16, 16, true);
      /* sample format (raw) */
      view.setUint16(20, 1, true);
      /* channel count */
      view.setUint16(22, numChannels, true);
      /* sample rate */
      view.setUint32(24, sampleRate, true);
      /* byte rate (sample rate * block align) */
      view.setUint32(28, sampleRate * blockAlign, true);
      /* block align */
      view.setUint16(32, blockAlign, true);
      /* bits per sample */
      view.setUint16(34, bitDepth, true);
      /* data chunk identifier */
      writeString(view, 36, 'data');
      /* data chunk length */
      view.setUint32(40, samples.length * bytesPerSample, true);

      floatTo16BitPCM(view, 44, samples);

      return new Blob([buffer], { type: 'audio/mp3' });
    }

    function floatTo16BitPCM(output, offset, input) {
      for (let i = 0; i < input.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, input[i]));
        output.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }
  </script>
