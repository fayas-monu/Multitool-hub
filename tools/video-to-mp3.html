<title>Video to MP3 — MULTI TOOL HUB</title>
<meta name="description" content="Pull the audio out of a video file. Everything happens in your browser, nothing is uploaded.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">

</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOL HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Video to MP3</h1>
<p class="lead">Pull the audio out of a video file. Everything happens in your browser, nothing is uploaded.</p>
<label class="drop" id="zone"><i class="fa-solid fa-file-audio" aria-hidden="true"></i><strong>Choose a video or drop it here</strong><span>MP4, WebM, MOV and most audio files</span>
<input type="file" id="fileInput" accept="video/*,audio/*" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span id="sz" style="color:var(--muted)"></span></p>
  <label class="f" for="br">MP3 quality</label>
  <select class="in" id="br"><option value="96">Small (96 kbps)</option><option value="128" selected>Standard (128 kbps)</option><option value="192">High (192 kbps)</option></select>
  <div class="prog" id="prog"><div></div></div>
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-music"></i> Convert to MP3</button></div>
  <p class="hint">Large videos use a lot of memory. Files over about 500 MB may fail.</p>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<div class="foot"><a href="../terms.html">Terms &amp; Conditions</a><a href="../privacy.html">Privacy Policy</a><span>&copy; 2026 MULTI TOOL HUB</span></div>
<script src="../assets/app.js"></script>
<script src="../assets/chat.js"></script>
<script>
let file=null;const $=PE.$;
PE.drop($("zone"),$("fileInput"),/^(video|audio)\//i,l=>{file=l[0];$("fn").textContent=file.name;$("sz").textContent=PE.fmt(file.size);$("panel").hidden=false;PE.status("")});
function wav(buf){const ch=buf.numberOfChannels,len=buf.length*ch*2,v=new DataView(new ArrayBuffer(44+len));
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,"RIFF");v.setUint32(4,36+len,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,buf.sampleRate,true);v.setUint32(28,buf.sampleRate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,len,true);
  let o=44;for(let i=0;i<buf.length;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));v.setInt16(o,s<0?s*32768:s*32767,true);o+=2}
  return new Blob([v],{type:"audio/wav"})}
function i16(f){const o=new Int16Array(f.length);for(let i=0;i<f.length;i++){const s=Math.max(-1,Math.min(1,f[i]));o[i]=s<0?s*32768:s*32767}return o}
$("go").onclick=async()=>{
  $("go").disabled=true;PE.status("Reading audio…");PE.progress(0);
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ctx.decodeAudioData(await file.arrayBuffer());
    if(typeof lamejs==="undefined"){PE.download(wav(buf),PE.baseName(file.name)+".wav");PE.progress(1);PE.status("MP3 encoder didn’t load, so you got a WAV file instead.","ok");$("go").disabled=false;return}
    const ch=Math.min(2,buf.numberOfChannels),enc=new lamejs.Mp3Encoder(ch,buf.sampleRate,+$("br").value);
    const L=i16(buf.getChannelData(0)),R=ch>1?i16(buf.getChannelData(1)):null,parts=[],step=1152*20;
    for(let i=0;i<L.length;i+=step){
      const d=ch>1?enc.encodeBuffer(L.subarray(i,i+step),R.subarray(i,i+step)):enc.encodeBuffer(L.subarray(i,i+step));
      if(d.length)parts.push(d);
      if((i/step)%20===0){PE.progress(i/L.length);PE.status(Math.round(i/L.length*100)+"% encoded…");await new Promise(r=>setTimeout(r))}
    }
    const end=enc.flush();if(end.length)parts.push(end);
    PE.download(new Blob(parts,{type:"audio/mpeg"}),PE.baseName(file.name)+".mp3");
    PE.progress(1);PE.status("Done. Your MP3 is downloading.","ok");PE.toast("Download started");
  }catch(e){PE.progress(null);PE.status("Couldn’t read audio from this file. Try an MP4, WebM or MP3.","err")}
  $("go").disabled=false;
};
</script>
</body>
</html>
