<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watermark PDF — PDF EDIT TOOL</title>
<meta name="description" content="Add a text or image watermark and watch it appear live on your page before you download.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">PDF EDIT TOOL</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Watermark PDF</h1>
<p class="lead">Add a text or image watermark and watch it appear live on your page before you download.</p>
<label class="drop" id="zone"><i class="fa-solid fa-stamp" aria-hidden="true"></i><strong>Choose a PDF or drop it here</strong><span>One file at a time</span>
<input type="file" id="fileInput" accept="application/pdf" ></label>
<div class="panel" id="panel" hidden>
  <p><strong id="fn"></strong> <span id="pc" style="color:var(--muted)"></span> <span class="live">● Live preview</span></p>
  <div class="pv"><canvas id="base"></canvas><canvas id="ov" class="ov"></canvas></div>
  <div class="g2">
    <div><label class="f" for="mode">Type</label><select class="in" id="mode"><option value="text">Text</option><option value="image">Image / logo</option></select></div>
    <div><label class="f" for="lay">Layout</label><select class="in" id="lay"><option value="one">One, centred</option><option value="tile">Repeated across the page</option></select></div>
  </div>
  <div id="tbox"><label class="f" for="txt">Watermark text</label><input class="in" id="txt" value="CONFIDENTIAL" maxlength="40">
    <div class="g2"><div><label class="f" for="size">Text size: <span id="sv">60</span> pt</label><input type="range" id="size" min="16" max="160" value="60" style="width:100%"></div>
    <div><label class="f" for="col">Colour</label><input type="color" id="col" value="#808090" style="width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg)"></div></div></div>
  <div id="ibox" hidden><label class="f" for="imf">Image (PNG, JPG or WebP)</label><input class="in" type="file" id="imf" accept="image/*">
    <label class="f" for="isz">Image width: <span id="iv">40</span>% of page</label><input type="range" id="isz" min="10" max="100" value="40" style="width:100%"></div>
  <div class="g2">
    <div><label class="f" for="op">Opacity: <span id="ov2">25</span>%</label><input type="range" id="op" min="5" max="100" value="25" style="width:100%"></div>
    <div><label class="f" for="ang">Angle: <span id="av">45</span>°</label><input type="range" id="ang" min="-90" max="90" value="45" style="width:100%"></div>
  </div>
  <label class="f" for="rg">Pages (leave empty for all)</label><input class="in" id="rg" placeholder="e.g. 1-3, 5">
  <div class="row"><button class="btn" id="go"><i class="fa-solid fa-stamp"></i> Apply &amp; download</button></div>
  <p class="hint">The preview shows page 1. Latin letters, numbers and common symbols are supported for text.</p>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<div class="foot"><a href="../terms.html">Terms &amp; Conditions</a><a href="../privacy.html">Privacy Policy</a><span>&copy; 2026 MULTI TOOL HUB</span></div>
<script src="../assets/app.js"></script>
<script src="../assets/chat.js"></script>
<script>
let file=null,doc=null,info=null,img=null,imgBytes=null;const $=PE.$;
const g=()=>({mode:$("mode").value,tile:$("lay").value==="tile",text:$("txt").value.trim(),size:+$("size").value,col:$("col").value,op:$("op").value/100,ang:+$("ang").value*Math.PI/180,isz:$("isz").value/100});
function centers(W,H,o,iw,w){
  if(!o.tile)return [[W/2,H/2]];
  const sx=(o.mode==="image"?iw:Math.max(w,o.size*4))*1.25+40,sy=(o.mode==="image"?iw*0.8:o.size)*2.6+30,out=[];let r=0;
  for(let y=sy/2;y<H+sy;y+=sy,r++)for(let x=(r%2?0:sx/2);x<W+sx;x+=sx)out.push([x,y]);
  return out}
function tw(o){const c=document.createElement("canvas").getContext("2d");c.font=`bold ${o.size}px Helvetica,Arial,sans-serif`;return c.measureText(o.text).width}
function draw(){
  if(!info)return;const o=g(),cv=$("ov"),b=$("base");cv.width=b.width;cv.height=b.height;const x=cv.getContext("2d"),s=info.s;
  const iw=info.pw*o.isz,ih=img?iw*img.height/img.width:0;
  centers(info.pw,info.ph,o,iw,tw(o)).forEach(([cx,cy])=>{
    x.save();x.translate(cx*s,cy*s);x.rotate(-o.ang);x.globalAlpha=o.op;
    if(o.mode==="text"&&o.text){x.fillStyle=o.col;x.font=`bold ${o.size*s}px Helvetica,Arial,sans-serif`;x.textAlign="center";x.fillText(o.text,0,0.35*o.size*s)}
    else if(o.mode==="image"&&img)x.drawImage(img,-iw*s/2,-ih*s/2,iw*s,ih*s);
    x.restore()});
}
["mode","lay","txt","size","col","op","ang","isz"].forEach(i=>$(i).addEventListener("input",()=>{
  $("sv").textContent=$("size").value;$("ov2").textContent=Math.round($("op").value);$("av").textContent=$("ang").value;$("iv").textContent=$("isz").value;
  $("tbox").hidden=$("mode").value!=="text";$("ibox").hidden=$("mode").value!=="image";draw()}));
$("imf").onchange=()=>{const f=$("imf").files[0];if(!f)return;const im=new Image();im.onload=()=>{img=im;
  const c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);
  c.toBlob(async b=>{imgBytes=await b.arrayBuffer();draw()},"image/png")};im.src=URL.createObjectURL(f)};
PE.drop($("zone"),$("fileInput"),/pdf/i,async l=>{
  file=l[0];PE.status("Loading preview…");
  try{doc=await PE.readPdf(file);info=await PE.preview(file,$("base"),560);$("fn").textContent=file.name;$("pc").textContent="· "+info.pages+" pages";$("panel").hidden=false;PE.status("");draw()}
  catch(e){PE.status(e.message||"Couldn’t read this PDF.","err")}
});
$("go").onclick=async()=>{
  const o=g();
  if(o.mode==="text"&&!o.text){PE.status("Enter the watermark text first.","err");return}
  if(o.mode==="image"&&!imgBytes){PE.status("Choose an image first.","err");return}
  try{
    const {rgb,degrees,StandardFonts}=PDFLib,n=doc.getPageCount(),idx=$("rg").value.trim()?PE.ranges($("rg").value,n):[...Array(n).keys()];
    const font=await doc.embedFont(StandardFonts.HelveticaBold),pimg=o.mode==="image"?await doc.embedPng(imgBytes):null,c=Math.cos(o.ang),s=Math.sin(o.ang),col=PE.hex(o.col),deg=o.ang*180/Math.PI;
    idx.forEach(pi=>{
      const p=doc.getPage(pi),{width:W,height:H}=p.getSize();
      if(o.mode==="text"){
        const w=font.widthOfTextAtSize(o.text,o.size),h=o.size*0.7;
        centers(W,H,o,0,w).forEach(([cx,cy])=>p.drawText(o.text,{x:cx-(w/2)*c+(h/2)*s,y:(H-cy)-(w/2)*s-(h/2)*c,size:o.size,font,color:rgb(...col),opacity:o.op,rotate:degrees(deg)}));
      }else{
        const iw=W*o.isz,ih=iw*pimg.height/pimg.width;
        centers(W,H,o,iw,0).forEach(([cx,cy])=>p.drawImage(pimg,{x:cx-(iw/2)*c+(ih/2)*s,y:(H-cy)-(iw/2)*s-(ih/2)*c,width:iw,height:ih,rotate:degrees(deg),opacity:o.op}));
      }});
    PE.download(await doc.save(),"watermarked_"+file.name,"application/pdf");
    PE.status("Watermark added to "+idx.length+" pages.","ok");PE.toast("Download started");
    doc=await PE.readPdf(file);
  }catch(e){PE.status(/encode|WinAnsi/i.test(e.message)?"That text has characters the font can’t draw. Use Latin letters and numbers.":e.message,"err")}
};
</script>
</body>
</html>
