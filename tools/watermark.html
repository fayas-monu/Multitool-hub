<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Watermark to PDF</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f5f8; color: #333; }
    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #e5322d; text-decoration: none; }
    .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
    .upload-area { background: #fff; border: 2px dashed #00796b; border-radius: 12px; padding: 50px 20px; cursor: pointer; margin-bottom: 20px; }
    .upload-area i { font-size: 48px; color: #00796b; margin-bottom: 15px; }
    .watermark-box { display: none; margin: 20px 0; }
    .watermark-box input { padding: 10px; width: 80%; max-width: 400px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    .btn { background: #00796b; color: #fff; border: none; padding: 12px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 15px; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="logo"><i class="fa-solid fa-file-pdf"></i> PDF Edit Tool</a>
  </header>
  <div class="container">
    <h1>Watermark PDF</h1>
    <p style="color:#666; margin-bottom: 20px;">Stamp custom text watermark over your PDF document.</p>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <i class="fa-solid fa-stamp"></i>
      <h3>Select PDF file</h3>
      <input type="file" id="fileInput" accept="application/pdf" style="display:none;" onchange="handleFile(this.files[0])">
    </div>
    
    <div class="watermark-box" id="wmBox">
      <input type="text" id="wmText" placeholder="Enter Watermark Text (e.g. CONFIDENTIAL)" value="CONFIDENTIAL">
      <br>
      <button class="btn" onclick="addWatermark()">Add Watermark & Download</button>
    </div>
  </div>
  <script>
    let selectedFile = null;
    function handleFile(file) {
      if(!file) return;
      selectedFile = file;
      document.getElementById('wmBox').style.display = 'block';
    }

    async function addWatermark() {
      if (!selectedFile) return;
      const text = document.getElementById('wmText').value || 'CONFIDENTIAL';
      const { PDFDocument, rgb, degrees } = PDFLib;

      const bytes = await selectedFile.arrayBuffer();
      const pdfDoc = await PDFDocument.load(bytes);
      const pages = pdfDoc.getPages();

      pages.forEach(page => {
        const { width, height } = page.getSize();
        page.drawText(text, {
          x: width / 4,
          y: height / 2,
          size: 50,
          color: rgb(0.75, 0.75, 0.75),
          rotate: degrees(45),
          opacity: 0.5,
        });
      });

      const pdfBytes = await pdfDoc.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `watermarked_${selectedFile.name}`;
      link.click();
    }
  </script>
</body>
</html>
