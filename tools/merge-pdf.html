<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Credit: (hank!nd3 p4d4y41! | FAYAS MONU -->
<title>Merge PDF — MULTI TOOLS HUB</title>
<meta name="description" content="Combine several PDFs into one. Drag files in, put them in order, then download.">
<meta name="theme-color" content="#11162b">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">MULTI TOOLS HUB</a>
  <a class="back" href="../index.html"><i class="fa-solid fa-arrow-left"></i> All tools</a>
</div></header>
<main>
<h1>Merge PDF</h1>
<p class="lead">Combine several PDFs into one. Drag files in, put them in order, then download.</p>
<label class="drop" id="zone"><i class="fa-solid fa-file-circle-plus" aria-hidden="true"></i><strong>Choose PDFs or drop them here</strong><span>Add two or more files</span>
<input type="file" id="fileInput" accept="application/pdf" multiple></label>
<div class="panel" id="panel" hidden>
  <ul class="files" id="list"></ul>
  <div class="prog" id="prog"><div></div></div>
  <div class="row"><button class="btn" id="go" disabled><i class="fa-solid fa-object-group"></i> Merge PDFs</button>
  <button class="btn ghost" id="clear">Clear all</button></div>
  <p class="hint">Files merge top to bottom. Use the arrows to change the order.</p>
</div>
<div class="status" id="status" role="status" aria-live="polite"></div>
</main>
<script src="../assets/app.js"></script>
<script>
let files=[];
const $=PE.$;
function render(){
  $("panel").hidden=!files.length;
  $("list").innerHTML=files.map((f,i)=>`<li><i class="fa-solid fa-file-pdf" style="color:var(--accent)"></i><span class="nm">${PE.esc(f.name)}</span><span class="sz">${PE.fmt(f.size)}</span>
  <button class="ib" data-a="up" data-i="${i}" aria-label="Move up" ${i===0?"disabled":""}><i class="fa-solid fa-arrow-up"></i></button>
  <button class="ib" data-a="down" data-i="${i}" aria-label="Move down" ${i===files.length-1?"disabled":""}><i class="fa-solid fa-arrow-down"></i></button>
  <button class="ib" data-a="rm" data-i="${i}" aria-label="Remove ${PE.esc(f.name)}"><i class="fa-solid fa-xmark"></i></button></li>`).join("");
  $("go").disabled=files.length<2;
  PE.status(files.length===1?"Add at least one more PDF to merge.":"");
}
PE.drop($("zone"),$("fileInput"),/pdf/i,l=>{files.push(...l);render()});
$("list").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
  if(a==="rm")files.splice(i,1);else{const j=a==="up"?i-1:i+1;[files[i],files[j]]=[files[j],files[i]]}render()};
$("clear").onclick=()=>{files=[];render()};
$("go").onclick=async()=>{
  $("go").disabled=true;
  try{
    const out=await PDFLib.PDFDocument.create();
    for(let i=0;i<files.length;i++){
      PE.status(`Adding ${files[i].name} (${i+1} of ${files.length})…`);PE.progress(i/files.length);
      const src=await PE.readPdf(files[i]);
      (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
    }
    PE.download(await out.save(),"merged.pdf","application/pdf");
    PE.progress(1);PE.status(`Merged ${files.length} files into ${out.getPageCount()} pages.`,"ok");PE.toast("Downloaded merged.pdf");
  }catch(e){PE.progress(null);PE.status(e.message,"err")}
  $("go").disabled=files.length<2;
};
</script>
</body>
</html>
