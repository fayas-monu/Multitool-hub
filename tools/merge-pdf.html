<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge PDF Files Online</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f5f8; color: #333; }
    header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: #e5322d; text-decoration: none; }
    .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
    .upload-area { background: #fff; border: 2px dashed #e5322d; border-radius: 12px; padding: 50px 20px; cursor: pointer; margin-bottom: 20px; }
    .upload-area i { font-size: 48px; color: #e5322d; margin-bottom: 15px; }
    .btn { background: #e5322d; color: #fff; border: none; padding: 12px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-top: 15px; display: none; }
    .file-list { list-style: none; margin: 20px 0; text-align: left; }
    .file-item { background: #fff; padding: 12px 15px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="logo"><i class="fa-solid fa-file-pdf"></i> PDF Edit Tool</a>
  </header>
  <div class="container">
    <h1>Merge PDF Files</h1>
    <p style="color:#666; margin-bottom: 20px;">Combine multiple PDFs in seconds with no server upload required.</p>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <i class="fa-solid fa-file-circle-plus"></i>
      <h3>Select PDF files</h3>
      <input type="file" id="fileInput" multiple accept="application/pdf" style="display:none;" onchange="handleFiles(this.files)">
    </div>
    <ul id="fileList" class="file-list"></ul>
    <button class="btn" id="mergeBtn" onclick="mergePDFs()">Merge & Download PDF</button>
  </div>
  <script>
    let pdfFiles = [];
    function handleFiles(files) {
      for (let f of files) { pdfFiles.push(f); }
      updateList();
    }
    function updateList() {
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      pdfFiles.forEach((f, i) => {
        list.innerHTML += `<li class="file-item"><span><i class="fa-solid fa-file-pdf" style="color:#e5322d;margin-right:8px;"></i>${f.name}</span><i class="fa-solid fa-trash" style="color:#d32f2f;cursor:pointer;" onclick="removeFile(${i})"></i></li>`;
      });
      document.getElementById('mergeBtn').style.display = pdfFiles.length > 1 ? 'inline-block' : 'none';
    }
    function removeFile(i) { pdfFiles.splice(i, 1); updateList(); }
    async function mergePDFs() {
      const { PDFDocument } = PDFLib;
      const mergedPdf = await PDFDocument.create();
      for (let file of pdfFiles) {
        const bytes = await file.arrayBuffer();
        const pdf = await PDFDocument.load(bytes);
        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        copiedPages.forEach(page => mergedPdf.addPage(page));
      }
      const pdfBytes = await mergedPdf.save();
      const blob = new Blob([pdfBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'merged-document.pdf';
      link.click();
    }
  </script>
</body>
</html>
