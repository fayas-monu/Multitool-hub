      <g transform="translate(11 18)">
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 0 13.5Z" fill="url(#amber)"/>
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v1.4H0Z" fill="#fff" opacity=".35"/>
        <path d="M6 6.2h4.4l2 2V13H6Z" fill="#fff" opacity=".92"/>
      </g>
      <g transform="translate(98 17)">
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 0 13.5Z" fill="url(#teal)"/>
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v1.4H0Z" fill="#fff" opacity=".35"/>
        <circle cx="6.3" cy="6.3" r="2" fill="#fff" opacity=".92"/>
        <path d="m4.5 12.5 2.8-3.2 2 2.1 1.6-1.7 2.6 2.8Z" fill="#fff" opacity=".92"/>
      </g>
      <g transform="translate(10 98)">
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 0 13.5Z" fill="url(#rose)"/>
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v1.4H0Z" fill="#fff" opacity=".35"/>
        <path d="M9.3 4.4a2.2 2.2 0 1 0 .1 4.4V9l4-1v3.2a1.9 1.9 0 1 1-1.5-1.85V6.3l-2.6.65Z" fill="#fff" opacity=".92"/>
      </g>
      <g transform="translate(97 97)">
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v9a4.5 4.5 0 0 1-4.5 4.5h-9A4.5 4.5 0 0 1 0 13.5Z" fill="url(#violet)"/>
        <path d="M0 4.5A4.5 4.5 0 0 1 4.5 0h9A4.5 4.5 0 0 1 18 4.5v1.4H0Z" fill="#fff" opacity=".35"/>
        <path d="m9 4.2 1.4 3 3.3.4-2.4 2.3.6 3.3L9 11.65 6.1 13.2l.6-3.3-2.4-2.3 3.3-.4Z" fill="#fff" opacity=".92"/>
      </g>
    </g>
    <g fill="none" stroke="#9fa3ff" stroke-width="1.1" stroke-linecap="round" opacity=".42">
      <path d="M25 34 45 45"/><path d="m103 33-20 12"/><path d="m24 95 19-11"/><path d="m104 94-19-12"/>
    </g>

    <!-- 3D hub cube -->
    <g opacity=".55" filter="url(#soft)" transform="translate(0 5)">
      <path d="M64 31.5 98.5 51 64 70.5 29.5 51Z" fill="#05070f"/>
      <path d="M29.5 51 64 70.5V106L29.5 86.5Z" fill="#05070f"/>
      <path d="M64 70.5 98.5 51v35.5L64 106Z" fill="#05070f"/>
    </g>
    <g filter="url(#lift)">
      <use href="#cubeLeft" fill="url(#left)"/>
      <use href="#cubeRight" fill="url(#right)"/>
      <use href="#cubeTop" fill="url(#top)"/>
      <use href="#cubeTop" fill="url(#shine)"/>
      <path d="M64 31.5 98.5 51 64 70.5 29.5 51Z" fill="none" stroke="#fff" stroke-opacity=".42" stroke-width="1"/>
      <path d="M29.5 51 64 70.5M64 70.5 98.5 51M64 70.5V106" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="1"/>
      <path d="M29.5 51v35.5L64 106M98.5 51v35.5L64 106" fill="none" stroke="#070a18" stroke-opacity=".35" stroke-width="1"/>
    </g>

    <!-- hub glyph -->
    <g transform="translate(64 51)">
      <path d="m0-10 10.4 6v12L0 14l-10.4-6V-4Z" fill="#fff" opacity=".96"/>
      <path d="m0-10 10.4 6v1.7L0-8.2l-10.4 5.9V-4Z" fill="#fff" opacity=".55"/>
      <g fill="#3d3bf3">
        <circle cx="0" cy="0" r="2.2"/>
        <circle cx="-5.4" cy="3.1" r="1.5" opacity=".82"/>
        <circle cx="5.4" cy="3.1" r="1.5" opacity=".82"/>
        <circle cx="0" cy="6.2" r="1.5" opacity=".82"/>
      </g>
      <g stroke="#3d3bf3" stroke-width="1" opacity=".7">
        <path d="M0 0-5.4 3.1M0 0l5.4 3.1M0 0v6.2"/>
      </g>
    </g>
    <path d="M86 21.5 87.6 26l4.5 1.6-4.5 1.6-1.6 4.5-1.6-4.5-4.5-1.6 4.5-1.6Z" fill="#fff" opacity=".85"/>
    <path d="M39 112.5l1.1 3.2 3.2 1.1-3.2 1.1-1.1 3.2-1.1-3.2-3.2-1.1 3.2-1.1Z" fill="#9fa3ff" opacity=".8"/>
  </g>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
</svg>
