<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="mthTitle">
  <title id="mthTitle">MULTI TOOL HUB</title>
  <defs>
    <linearGradient id="badge" x1="16" y1="8" x2="112" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232b5e"/>
      <stop offset=".48" stop-color="#121734"/>
      <stop offset="1" stop-color="#090c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(39 29) rotate(48) scale(88)">
      <stop offset="0" stop-color="#8f93ff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#4d4dff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="40" y1="34" x2="88" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8cbff"/>
      <stop offset=".45" stop-color="#8d8dff"/>
      <stop offset="1" stop-color="#6861f5"/>
    </linearGradient>
    <linearGradient id="left" x1="30" y1="54" x2="65" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a48e8"/>
      <stop offset="1" stop-color="#2a269e"/>
    </linearGradient>
    <linearGradient id="right" x1="98" y1="54" x2="63" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b06bff"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4e1fb0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe985"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cf7e4"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3c9"/><stop offset="1" stop-color="#e11d62"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d5b8ff"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="32" y1="38" x2="64" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="2.4" flood-color="#05070f" flood-opacity=".55"/>
    </filter>
    <filter id="nodeShadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-color="#05070f" flood-opacity=".6"/>
    </filter>
    <path id="cubeTop" d="M64 31.5 98.5 51 64 70.5 29.5 51Z"/>
    <path id="cubeLeft" d="M29.5 51 64 70.5V106L29.5 86.5Z"/>
    <path id="cubeRight" d="M64 70.5 98.5 51v35.5L64 106Z"/>
    <clipPath id="badgeClip"><rect x="4" y="4" width="120" height="120" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#badge)"/>
    <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#glow)"/>
    <g fill="none" stroke="#fff" stroke-opacity=".1">
